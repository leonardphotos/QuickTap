apply plugin: 'com.android.application'

// Firma de release. Las credenciales viven FUERA del repo (por defecto en
// ~/QuickTap-keys/keystore.properties): el keystore es el que permite publicar
// actualizaciones de la app, si se pierde nadie que ya la tenga instalada podrá actualizarla.
// Sin ese archivo el proyecto igual compila en debug, solo que `assembleRelease` sale sin firmar.
def keystorePropsFile = file(System.getenv("QUICKTAP_KEYSTORE_PROPS")
    ?: "${System.properties['user.home']}/QuickTap-keys/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "club.quicktap.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "club.quicktap.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps['QUICKTAP_KEYSTORE']) {
                storeFile file(keystoreProps['QUICKTAP_KEYSTORE'])
                storePassword keystoreProps['QUICKTAP_STORE_PASSWORD']
                keyAlias keystoreProps['QUICKTAP_KEY_ALIAS']
                keyPassword keystoreProps['QUICKTAP_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreProps['QUICKTAP_KEYSTORE']) {
                signingConfig signingConfigs.release
            }
            // R8 (minifyEnabled/shrinkResources) recortaría el APK ~2-3 MB, y las reglas que
            // hacen falta ya están escritas en proguard-rules.pro. Queda APAGADO porque no se
            // pudo probar: Capacitor resuelve sus plugins por reflexión y una regla incompleta
            // no falla al compilar — falla en el teléfono, con la pantalla en blanco al abrir.
            // Para activarlo: poner las dos líneas en true, compilar el APK e INSTALARLO en un
            // teléfono real; si abre y navega, quedó bien. El peso del APK se descarga una vez;
            // lo que se siente en cada uso es el bundle web, que sí se optimizó (ver el trozo
            // del escáner, que dejó de viajar con la pantalla de Pedidos).
            minifyEnabled false
            // shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
